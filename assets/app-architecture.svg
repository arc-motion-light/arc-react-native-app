<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">ARC App connects people, hardware, and permitted cloud data</title><desc id="desc">A shared React Native experience connects through native BLE to ARC Lamp and Probe hardware, and through authenticated APIs to cloud data. The hardware uses OpenThread independently of the phone.</desc><rect width="960" height="330" rx="18" fill="#101923"/><g fill="#e6edf3" font-family="sans-serif"><text x="38" y="47" font-size="22">ARC — intelligent interaction with the physical world</text><g stroke="#3b5669" stroke-width="2"><rect x="35" y="100" width="270" height="150" rx="12" fill="#172b39"/><rect x="360" y="70" width="270" height="105" rx="12" fill="#172b39"/><rect x="360" y="195" width="270" height="105" rx="12" fill="#172b39"/><rect x="690" y="100" width="235" height="150" rx="12" fill="#172b39"/></g><text x="58" y="135" font-size="20">Shared React Native App</text><text x="58" y="169" font-size="16">Lighting · schedules · graphs</text><text x="58" y="198" font-size="16">iOS validated in development</text><text x="58" y="226" font-size="16">Android: next experiment</text><text x="383" y="104" font-size="20">Native BLE / device packets</text><text x="383" y="139" font-size="16">Current hardware + legacy bridges</text><text x="383" y="228" font-size="20">Authenticated cloud clients</text><text x="383" y="263" font-size="16">Accounts · grants · history</text><text x="711" y="135" font-size="20">ARC physical systems</text><text x="711" y="170" font-size="16">G4 Lamp · WBA5 · Probe</text><text x="711" y="202" font-size="16">BLE + OpenThread</text><text x="711" y="230" font-size="16">Control · sensing · history</text></g><g fill="none" stroke="#65c6ad" stroke-width="3"><path d="M305 143 H340 V122 H360 M305 207 H340 V247 H360 M630 122 H690 M630 247 H670 V220 H690"/></g></svg>